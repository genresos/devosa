<html>
<head>
  <title>[var.strPageTitle]</title>
  <meta http-equiv="Content-Type" content="text/html; charset=us-ascii" />
  <link rel="icon" href="./favicon.ico" type="image/ico">
  <link rel="shortcut icon" href="./favicon.ico" type="image/ico">

  <style>
    body {
      margin: 0;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #7b4397, #dc2430);
    }

    .login-container {
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
      padding: 20px;
    }

    .login-box {
      background: #ffffff; /* putih solid */
      border: 2px solid #800080; /* ungu solid */
      border-radius: 16px;
      padding: 40px;
      width: 100%;
      max-width: 380px;
      text-align: center;
      box-shadow: 0 8px 24px rgba(0,0,0,0.15);
      color: #333; /* teks gelap agar terbaca */
      animation: fadeIn 0.8s ease-out;
    }


    .login-box img.logo {
      width: 180px;
      margin-bottom: 15px;
    }

    .login-box h2 {
      margin-bottom: 25px;
      font-size: 20px;
      font-weight: 500;
      line-height: 1.4;
    }

    .login-box input[type="text"],
    .login-box input[type="password"] {
      width: 100%;
      padding: 12px;
      margin-bottom: 15px;
      border-radius: 8px;
      border: none;
      background: rgba(255,255,255,0.9);
      font-size: 14px;
      outline: none;
      transition: 0.3s ease;
    }

    .login-box input[type="text"]:focus,
    .login-box input[type="password"]:focus {
      box-shadow: 0 0 0 2px #ff6ec7;
    }

    .login-box input[type="submit"] {
      background: linear-gradient(135deg, #ff6ec7, #7b4397);
      border: none;
      color: white;
      padding: 12px;
      width: 100%;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      font-size: 15px;
      transition: 0.3s ease;
    }

    .login-box input[type="submit"]:hover {
      transform: translateY(-2px);
      background: linear-gradient(135deg, #ff80d0, #9a57b6);
    }
    .login-box h2 {
      margin-bottom: 25px;
      font-size: 22px;
      font-weight: 700;
      line-height: 1.4;
      letter-spacing: 0.5px;
      background: linear-gradient(135deg, #ffdde1, #ee9ca7);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 1px 2px rgba(0,0,0,0.3);
    }


    .copyright {
      margin-top: 15px;
      font-size: 12px;
      opacity: 0.8;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>

  <script type="text/javascript">
    var submitCount = 0;
    function isValid() {
      if (submitCount != 0) return false;
      if (document.LoginForm.dataUserName.value.trim() === "") {
        alert("Silakan masukkan username Anda!");
        document.LoginForm.dataUserName.focus();
        return false;
      }
      if (document.LoginForm.dataPassword.value.trim() === "") {
        alert("Silakan masukkan password Anda!");
        document.LoginForm.dataPassword.focus();
        return false;
      }
      submitCount++;
      return true;
    }

    function windowLoad() {
      [var.strErrorAlert]
      var myForm = document.LoginForm;
      myForm.dataUserName.focus();
      myForm.dataUserName.select();
    }
    window.onload = windowLoad;
  </script>
</head>

<body>
  <div class="login-container">
    <div class="login-box">
      <img src=""https://ibb.co.com/0yx9TPXR"><img src="https://i.ibb.co.com/0yx9TPXR/RSIA-BUDI-LESTARI-001-removebg-preview.png" alt="RSIA-BUDI-LESTARI-001-removebg-preview" border="0" />
      <h2>Human Resources<br>RS Budi Lestari</h2>

      <form action="index.php" name="LoginForm" method="post" onsubmit="return isValid();">
        <input type="text" name="dataUserName" placeholder="Username" />
        <input type="password" name="dataPassword" placeholder="Password" />
        [var.strInputPage]
        <input type="submit" name="btnLogin" value="Login" />
      </form>

      <div class="copyright">
        [var.strCopyright; protect=no; htmlconv=no]
      </div>
    </div>
  </div>
</body>
</html>
